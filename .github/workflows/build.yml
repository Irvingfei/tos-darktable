name: build

# Four jobs, ordered by cost:
#
#   metadata  seconds   the package contract, the launcher self-test, and a
#                       metadata-only package. Catches most submission problems
#                       without compiling anything.
#   build     30-55 min compiles darktable and collects the runtime closure.
#   verify    minutes   installs the package into a bare ubuntu:22.04 and runs
#                       it end to end. The only check that proves the bundled
#                       runtime is complete.
#   release   seconds   on tags: publishes the package and its SHA-256, which
#                       the TOS developer platform requires for every binary.
#
# Three things about this file are worth knowing before editing it, all of them
# learned by getting them wrong.
#
# **Container steps use relative paths, never `${{ github.workspace }}`.** In a
# container job that expression expands to the *host* path
# (/home/runner/work/<repo>/<repo>); the same directory is mounted inside the
# container at /__w/<repo>/<repo>. A redirect or a tee to the host path fails
# with "No such file or directory", and with `pipefail` that failure becomes
# the step's exit status. A step's working directory is the workspace in both
# cases, so a relative path is correct everywhere.
#
# **Container steps name bash explicitly.** A container job's default shell is
# sh, which on Ubuntu is dash, and dash rejects `set -o pipefail` with
# "Illegal option" - the step then dies in zero seconds having produced
# nothing at all.
#
# **Scripts are invoked through `bash <path>`.** The repository is maintained
# from Windows, which cannot record a POSIX execute bit, so a direct invocation
# of a committed script dies with "Permission denied" in zero seconds.
#
# Failures are also reported as commit comments, because reading them here
# requires a token and the point is to be able to diagnose without one.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Override the version in config.ini (e.g. 1.0.9)"
        required: false
        type: string
      skip_build:
        description: "Only run the fast metadata job"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_ID: tos-darktable
  DT_VERSION: "5.6.1"
  # SHA-256 of the published release tarball, which is what actually gets
  # built. A tarball hash is a stronger pin than a commit: it also catches a
  # mirror serving different bytes, and the tarball carries the git submodules
  # (rawspeed, OpenCL, LibRaw, lua) that a plain clone does not.
  #
  # e8b84ac9... is the same file this package was developed against; verified
  # byte for byte.
  DARKTABLE_TARBALL_SHA256: "e8b84ac98b0b689a244e4036c4b56394c1d58ce2d9abc05e0a060ef9f756dc36"

jobs:
  # ------------------------------------------------------------------------- #
  metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Version literals agree with VERSION
        run: python3 tools/bump_version.py --check

      - name: Launcher self-test
        run: python3 tools/selftest.py -v

      - name: Pre-submission validation
        run: python3 tools/validate.py

      - name: Assemble a metadata-only package
        # No --stage: this exercises the metadata, the lifecycle scripts and
        # the webui packing without waiting for darktable to build.
        run: python3 tools/build.py --platform x86_64

      - name: Inspect the package structure
        run: python3 tools/inspect_deb.py

      - uses: actions/upload-artifact@v4
        with:
          name: metadata-package
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

      - name: Report the failure where it can be read
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: [
                `Automated failure report for run ${context.runId} (metadata job).`,
                '',
                'The Actions log endpoint requires repository admin rights, so this',
                'is posted as a commit comment instead. Reproduce locally with:',
                '',
                '```',
                'python3 tools/bump_version.py --check',
                'python3 tools/selftest.py -v',
                'python3 tools/validate.py',
                'python3 tools/build.py --platform x86_64',
                'python3 tools/inspect_deb.py',
                '```',
              ].join('\n'),
            });

  # ------------------------------------------------------------------------- #
  build:
    needs: metadata
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build != true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    # A bare ubuntu:22.04 rather than the runner image. The runner ships dozens
    # of -dev packages, and every optional find_package() that succeeds there
    # adds a library to the bundle; building in a container with an explicit
    # package list is what makes the collected closure reproducible.
    container:
      image: ubuntu:22.04
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Install build dependencies
        run: |
          set -o pipefail
          bash app/ci/install-build-deps.sh 2>&1 | tee apt.log

      - uses: actions/cache@v4
        with:
          path: |
            /root/.ccache
            build
          # Keyed on the darktable version and the build script, deliberately
          # not on ci/install-build-deps.sh. Adding a build tool does not
          # invalidate compiled objects, and including it here meant every
          # dependency fix threw away the whole ccache - turning each iteration
          # into a forty-minute rebuild instead of an eight-minute one. The
          # cases that genuinely require recompiling, such as changing the
          # compiler, are already part of ccache's own hash.
          key: dt-${{ env.DT_VERSION }}-${{ env.DARKTABLE_TARBALL_SHA256 }}-${{ hashFiles('app/ci/build-darktable.sh') }}
          restore-keys: |
            dt-${{ env.DT_VERSION }}-${{ env.DARKTABLE_TARBALL_SHA256 }}-

      - name: Build darktable
        env:
          CCACHE_DIR: /root/.ccache
          # Relative on purpose; see the note at the top of this file.
          WORK: work
          BUILD_DIR: build
          STAGE: stage
          DARKTABLE_VERSION: ${{ env.DT_VERSION }}
          DARKTABLE_TARBALL_SHA256: ${{ env.DARKTABLE_TARBALL_SHA256 }}
        run: |
          set -o pipefail
          bash app/ci/build-darktable.sh 2>&1 | tee build.log

      - name: Collect the runtime dependency bundle
        run: |
          set -o pipefail
          python3 app/ci/collect_deps.py \
            --stage stage \
            --report bundle-report.json \
            2>&1 | tee collect.log

      - name: Show what was built
        run: |
          du -sh stage/usr/local/tos-darktable/* || true
          ls -la stage/usr/local/tos-darktable/app/bin || true
          ls -la stage/usr/local/tos-darktable/depends/bin || true

      - name: Assemble the package
        run: |
          set -o pipefail
          python3 app/tools/build.py --platform x86_64 --stage stage 2>&1 | tee package.log

      - name: Upload the package
        # The path is the directory itself, with a trailing slash, so the deb
        # and its checksum land at the root of the artifact. Naming individual
        # files instead makes upload-artifact preserve their path relative to
        # the least common ancestor of everything uploaded - which, when the
        # bundle report was in the same upload, put them under app/dist/ and
        # broke every consumer expecting them at the top.
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: app/dist/
          if-no-files-found: error

      - name: Upload the bundle report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: bundle-report.json
          if-no-files-found: warn

      - name: Report the failure where it can be read
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // The workspace sits at a different path inside the container than
            // the one github.workspace names, so both are tried and the working
            // directory is the fallback that always resolves.
            const roots = [process.env.GITHUB_WORKSPACE, process.cwd()].filter(Boolean);

            const find = (name) => {
              for (const root of roots) {
                const file = path.join(root, name);
                if (fs.existsSync(file)) return file;
              }
              return null;
            };

            let body = `Automated failure report for run ${context.runId}.\n\n`;
            body += 'The Actions log endpoint requires repository admin rights, so\n';
            body += 'the diagnostics below are posted here instead.\n\n';

            let found = false;
            for (const name of ['apt.log', 'cmake-configure.log', 'build.log', 'collect.log', 'package.log']) {
              const file = find(name);
              if (!file) continue;
              found = true;
              const lines = fs.readFileSync(file, 'utf8').split('\n');
              body += `### ${name} — last 150 lines\n\`\`\`\n`;
              body += lines.slice(-150).join('\n');
              body += '\n```\n\n';
            }

            if (!found) {
              body += 'No captured output existed, so the failure happened in a step\n';
              body += 'that writes only to the runner log. The step conclusions in the\n';
              body += 'run summary identify which one.\n';
            }

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body.slice(0, 60000),
            });

  # ------------------------------------------------------------------------- #
  verify:
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build != true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    container:
      image: ubuntu:22.04
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts

      - name: Install only what a bare device would have
        # Deliberately not the build dependencies. If the bundle is missing
        # something, this is where it must fail.
        #
        # bzip2 is here because a real TOS device has it - verified on one -
        # and postinst needs it to unpack webui.bz2, as does the platform
        # itself. Leaving it out tested this container rather than the package.
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            dpkg binutils curl procps python3 ca-certificates bzip2

      - name: Install and run the package
        run: |
          set -o pipefail
          # Located rather than assumed: where a downloaded artifact puts its
          # files depends on how it was uploaded, and getting that wrong once
          # already cost a run.
          DEB="$(find artifacts -name '*.deb' | head -1)"
          if [ -z "$DEB" ]; then
            echo "no .deb found in the downloaded artifact:" >&2
            find artifacts -maxdepth 3 -print >&2
            exit 1
          fi
          echo "installing $DEB"
          bash app/ci/verify-package.sh "$DEB" 2>&1 | tee verify.log

      - name: Verify the declared checksum
        run: |
          set -eux
          cd "$(dirname "$(find artifacts -name '*.deb' | head -1)")"
          sha256sum -c *.sha256

      - name: Report the failure where it can be read
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const roots = [process.env.GITHUB_WORKSPACE, process.cwd()].filter(Boolean);

            let body = `Automated failure report for run ${context.runId} (verify job).\n\n`;
            let file = null;
            for (const root of roots) {
              const candidate = path.join(root, 'verify.log');
              if (fs.existsSync(candidate)) { file = candidate; break; }
            }

            if (file) {
              const lines = fs.readFileSync(file, 'utf8').split('\n');
              body += '### verify.log — last 200 lines\n```\n';
              body += lines.slice(-200).join('\n');
              body += '\n```\n';
            } else {
              body += 'verify.log was not created, so the package could not be unpacked\n';
              body += 'or the script did not start.\n';
            }

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body.slice(0, 60000),
            });

  # ------------------------------------------------------------------------- #
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tos-darktable_x86_64.deb
            tos-darktable_x86_64.deb.sha256
          generate_release_notes: true
          body: |
            darktable ${{ env.DT_VERSION }} packaged for TOS 7.

            Install from the TOS App Center, or download the assets below. The
            `.sha256` file is required by the developer platform and can be
            checked with `sha256sum -c tos-darktable_x86_64.deb.sha256`.

            Read the access password after installing with:
            `sudo cat /usr/local/tos-darktable/data/access.txt`
