# Nginx route for darktable for TOS.
#
# TOS opens this application in a new browser tab at http://${ip}:9312, which
# bypasses nginx entirely. This location block exists so the application is
# also reachable through the platform's own web UI, where the TOS session
# already authenticates the visitor.
#
# Only `location` blocks are permitted here (guide 8.3.2); no `server {}`.
#
# The Upgrade/Connection headers are not optional. The desktop is carried over
# a WebSocket, so without them the 101 handshake never completes and the page
# hangs on "connecting" even though the plain HTTP health endpoint answers.
# The guide's own nginx template omits them.

location /tos-darktable/ {
    proxy_pass http://127.0.0.1:9312/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    # The VNC stream is a long-lived bidirectional connection: buffering it
    # would add latency to every mouse move and the default 60s read timeout
    # would drop an idle session.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Do not let an intermediary rewrite or cache the streamed frames.
    add_header Cache-Control no-store;
}
